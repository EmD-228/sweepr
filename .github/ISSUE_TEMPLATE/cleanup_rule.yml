name: Cleanup rule
description: Propose something new for Sweepr to find and clean.
labels: [catalog]
body:
  - type: markdown
    attributes:
      value: |
        Rules live in `src-tauri/catalog/`. The "Adding a cleanup rule" section of CONTRIBUTING.md explains the format and the risk scale.
  - type: input
    id: what
    attributes:
      label: What it cleans
      placeholder: "Homebrew download cache"
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it is, or which official command cleans it
      placeholder: "~/Library/Caches/Homebrew, or `brew cleanup --prune=all`"
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level you suggest
      options:
        - "0: none, recreated automatically"
        - "1: low, recreated but costs time, network or a small action"
        - "2: to check, may contain the user's work"
        - "3: irreplaceable"
    validations:
      required: true
  - type: textarea
    id: loses
    attributes:
      label: What the user loses, and how it comes back
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Why it is safe
      description: Documentation, source code of the tool, or what happened when you deleted it by hand.
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Typical size on your machine
      placeholder: "3 GB"
