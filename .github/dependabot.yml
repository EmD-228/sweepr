# Monthly, grouped: one pull request for routine bumps, one for majors, per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      routine:
        patterns: ["*"]
        update-types: [minor, patch]
      major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      routine:
        patterns: ["*"]
        update-types: [minor, patch]
      major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
